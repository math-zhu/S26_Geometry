<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290">
  <!-- Triangle A=(200,60), B=(60,240), C=(340,240)
       Altitude from A to BC: foot D=(200,240)
       h = AD = 180; b=CA, c=AB
       b=CA=sqrt(140²+180²)=sqrt(19600+32400)≈228
       c=AB=sqrt(140²+180²)≈228 — too symmetric, shift A left
       A=(170,60), B=(60,240), C=(340,240)
       foot D=(170,240)
       b=CA=sqrt(170²+180²)=sqrt(28900+32400)≈248
       c=AB=sqrt(110²+180²)=sqrt(12100+32400)≈211
  -->
  <polygon points="170,60 60,240 340,240" fill="#eef4ff" stroke="#3366cc" stroke-width="2"/>

  <!-- Altitude from A to BC: foot D=(170,240) -->
  <line x1="170" y1="60" x2="170" y2="240" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="170" y="231" width="9" height="9" fill="none" stroke="#888" stroke-width="1.3"/>
  <text x="176" y="228" font-family="serif" font-size="13" fill="#888">D</text>

  <!-- h label on altitude -->
  <text x="176" y="155" font-family="serif" font-size="14" font-style="italic" fill="#888">h</text>

  <!-- Vertices -->
  <circle cx="170" cy="60"  r="3.5" fill="#3366cc"/>
  <circle cx="60"  cy="240" r="3.5" fill="#3366cc"/>
  <circle cx="340" cy="240" r="3.5" fill="#3366cc"/>
  <text x="163" y="50"  font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="42"  y="258" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="344" y="258" font-family="serif" font-size="17" font-style="italic">C</text>

  <!-- Side labels: a=BC (bottom), b=CA (right), c=AB (left) -->
  <text x="192" y="260" font-family="serif" font-size="15" font-style="italic" fill="#cc3333">a</text>
  <text x="266" y="162" font-family="serif" font-size="15" font-style="italic" fill="#cc3333">b</text>
  <text x="97"  y="162" font-family="serif" font-size="15" font-style="italic" fill="#cc3333">c</text>

  <!-- Angle B arc at B=(60,240)
       BA unit=(0.491,-0.871); BC unit=(1,0)
       22px toward A: (71,221); 22px toward C: (82,240); sweep=0 -->
  <path d="M 71,221 A 22,22 0 0,1 82,240" fill="none" stroke="#cc6600" stroke-width="1.6"/>
  <text x="80" y="226" font-family="serif" font-size="14" font-style="italic" fill="#cc6600">B</text>

  <!-- Angle C arc at C=(340,240)
       CA unit=(-0.686,-0.727); CB unit=(-1,0)
       22px toward A: (325,224); 22px toward B: (318,240); sweep=1 -->
  <path d="M 325,224 A 22,22 0 0,0 318,240" fill="none" stroke="#cc6600" stroke-width="1.6"/>
  <text x="308" y="227" font-family="serif" font-size="14" font-style="italic" fill="#cc6600">C</text>

  <!-- h = c sinB label -->
  <text x="60"  y="205" font-family="serif" font-size="13" fill="#555">h = c&#xB7;sin B</text>
  <!-- h = b sinC label -->
  <text x="235" y="205" font-family="serif" font-size="13" fill="#555">h = b&#xB7;sin C</text>

  <!-- Formula -->
  <text x="200" y="283" text-anchor="middle" font-family="serif" font-size="14">
    b/sin B = c/sin C = a/sin A
  </text>
</svg>
