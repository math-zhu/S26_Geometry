<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310">
  <!-- Byrne-style: Prop I.1 — Equilateral triangle on AB -->
  <!-- Arc of circle centred at A (blue) -->
  <circle cx="110" cy="284" r="200" fill="none" stroke="#3366cc" stroke-width="1.4" stroke-dasharray="7,5" opacity="0.75"/>
  <!-- Arc of circle centred at B (red) -->
  <circle cx="310" cy="284" r="200" fill="none" stroke="#cc3333" stroke-width="1.4" stroke-dasharray="7,5" opacity="0.75"/>
  <!-- Equilateral triangle ABC — yellow fill -->
  <polygon points="110,284 310,284 210,111" fill="#fffacc" stroke="none"/>
  <!-- Side AB — red -->
  <line x1="110" y1="284" x2="310" y2="284" stroke="#cc3333" stroke-width="2.5"/>
  <!-- Side AC — blue -->
  <line x1="110" y1="284" x2="210" y2="111" stroke="#3366cc" stroke-width="2.5"/>
  <!-- Side BC — green -->
  <line x1="310" y1="284" x2="210" y2="111" stroke="#228833" stroke-width="2.5"/>
  <!-- Tick marks — 1 tick on each side (equal) -->
  <!-- Tick on AB mid (210,284) -->
  <line x1="207" y1="278" x2="213" y2="290" stroke="#cc3333" stroke-width="2"/>
  <!-- Tick on AC mid (160,197) perp direction approx (0.866,0.5) → tick along (-0.5,0.866) -->
  <line x1="156" y1="194" x2="164" y2="200" stroke="#3366cc" stroke-width="2"/>
  <!-- Tick on BC mid (260,197) -->
  <line x1="264" y1="200" x2="256" y2="194" stroke="#228833" stroke-width="2"/>
  <!-- Vertex dots -->
  <circle cx="110" cy="284" r="3.5" fill="#333"/>
  <circle cx="310" cy="284" r="3.5" fill="#333"/>
  <circle cx="210" cy="111" r="3.5" fill="#333"/>
  <!-- Labels -->
  <text x="93"  y="304" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="314" y="304" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="203" y="101" font-family="serif" font-size="17" font-style="italic">C</text>
</svg>
