<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300">
  <!-- Two parallel lines -->
  <line x1="30" y1="80" x2="420" y2="80" stroke="black" stroke-width="2"/>
  <line x1="30" y1="220" x2="420" y2="220" stroke="black" stroke-width="2"/>
  
  <!-- Points on first line -->
  <circle cx="150" cy="80" r="4" fill="blue"/>
  <circle cx="300" cy="80" r="4" fill="blue"/>
  
  <!-- Points on second line -->
  <circle cx="100" cy="220" r="4" fill="red"/>
  <circle cx="250" cy="220" r="4" fill="red"/>
  
  <!-- Segments AB and CD -->
  <line x1="150" y1="80" x2="300" y2="80" stroke="blue" stroke-width="3"/>
  <line x1="100" y1="220" x2="250" y2="220" stroke="red" stroke-width="3"/>
  
  <!-- Connecting lines AC and BD (showing they are parallel) -->
  <line x1="150" y1="80" x2="100" y2="220" stroke="green" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="80" x2="250" y2="220" stroke="green" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Labels for points -->
  <text x="150" y="65" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" fill="blue">A</text>
  <text x="300" y="65" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" fill="blue">B</text>
  <text x="100" y="245" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" fill="red">C</text>
  <text x="250" y="245" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" fill="red">D</text>
  
  <!-- Segment labels -->
  <text x="225" y="70" text-anchor="middle" font-family="serif" font-size="14" fill="blue">AB</text>
  <text x="175" y="235" text-anchor="middle" font-family="serif" font-size="14" fill="red">CD</text>
  
  <!-- Parallel marks on AC and BD -->
  <text x="110" y="150" font-family="serif" font-size="14" fill="green">AC</text>
  <text x="260" y="150" font-family="serif" font-size="14" fill="green">BD</text>
  
  <!-- Title and annotation -->
  <text x="225" y="25" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold">Equal Segments on Parallel Lines</text>
  <text x="225" y="280" text-anchor="middle" font-family="serif" font-size="14">AB = CD because AC ∥ BD</text>
</svg>
