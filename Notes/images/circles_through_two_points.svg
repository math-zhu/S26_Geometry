<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280">
  <!-- Points A=(130,160) and B=(310,160), midpoint M=(220,160) -->

  <!-- Perpendicular bisector (dashed): x=220, vertical -->
  <line x1="220" y1="10" x2="220" y2="265" stroke="#aaa" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- Circle 1: center O1=(220,115), r≈101; dist to A=sqrt(90²+45²)=sqrt(10125)≈101 -->
  <circle cx="220" cy="115" r="101" fill="none" stroke="#3366cc" stroke-width="1.8"/>
  <circle cx="220" cy="115" r="2.5" fill="#3366cc"/>
  <text x="225" y="112" font-family="serif" font-size="14" font-style="italic" fill="#3366cc">O&#x2081;</text>
  <line x1="220" y1="115" x2="130" y2="160" stroke="#3366cc" stroke-width="1.1" stroke-dasharray="4,3"/>

  <!-- Circle 2: center O2=(220,160), r=90 — center at midpoint of AB -->
  <circle cx="220" cy="160" r="90" fill="none" stroke="#cc6600" stroke-width="1.8"/>
  <circle cx="220" cy="160" r="2.5" fill="#cc6600"/>
  <text x="225" y="157" font-family="serif" font-size="14" font-style="italic" fill="#cc6600">O&#x2082;</text>
  <line x1="220" y1="160" x2="130" y2="160" stroke="#cc6600" stroke-width="1.1" stroke-dasharray="4,3"/>

  <!-- Points A and B on top -->
  <circle cx="130" cy="160" r="4" fill="black"/>
  <circle cx="310" cy="160" r="4" fill="black"/>
  <text x="114" y="178" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="314" y="178" font-family="serif" font-size="17" font-style="italic">B</text>

  <!-- Caption -->
  <text x="220" y="278" text-anchor="middle" font-family="serif" font-size="14" fill="#333">
    All centers lie on the perpendicular bisector of AB.
  </text>
</svg>
