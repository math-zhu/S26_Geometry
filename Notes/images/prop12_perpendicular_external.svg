<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310">
  <!-- Byrne-style: Prop I.12 — Drop perpendicular from external point to a line -->
  <!-- Line AB, extended, horizontal at y=245 -->
  <line x1="20"  y1="245" x2="400" y2="245" stroke="#333" stroke-width="2.2"/>
  <!-- External point C above the line -->
  <circle cx="190" cy="65" r="4.5" fill="#333"/>
  <!-- Circle centred at C passing through E and F on the line -->
  <!-- radius = distance from C to E/F on line -->
  <!-- E=(70,245), F=(310,245): CE = sqrt((190-70)²+(65-245)²)=sqrt(14400+32400)=sqrt(46800)=216.3 -->
  <!-- CF = sqrt((190-310)²+(65-245)²)=sqrt(14400+32400)=216.3 ✓ -->
  <!-- Draw arc from E to F below C (upper semicircle from C's perspective) -->
  <path d="M 70,245 A 216,216 0 0,1 310,245" fill="none" stroke="#3366cc" stroke-width="1.4" stroke-dasharray="6,4"/>
  <!-- Lines CE and CF -->
  <line x1="190" y1="65" x2="70"  y2="245" stroke="#3366cc" stroke-width="2"/>
  <line x1="190" y1="65" x2="310" y2="245" stroke="#cc3333" stroke-width="2"/>
  <!-- Midpoint G of EF -->
  <circle cx="190" cy="245" r="4.5" fill="#cc3333"/>
  <!-- Tick marks on EG and GF -->
  <line x1="127" y1="238" x2="131" y2="252" stroke="#555" stroke-width="1.8"/>
  <line x1="249" y1="238" x2="253" y2="252" stroke="#555" stroke-width="1.8"/>
  <!-- Perpendicular CG -->
  <line x1="190" y1="65" x2="190" y2="262" stroke="#228833" stroke-width="2.2"/>
  <!-- Right-angle marker at G -->
  <rect x="193" y="234" width="10" height="10" fill="none" stroke="#555" stroke-width="1.3"/>
  <!-- E, F dots -->
  <circle cx="70"  cy="245" r="4" fill="#3366cc"/>
  <circle cx="310" cy="245" r="4" fill="#cc3333"/>
  <!-- Labels -->
  <text x="15"  y="250" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="403" y="250" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="60"  y="266" font-family="serif" font-size="17" font-style="italic">E</text>
  <text x="314" y="266" font-family="serif" font-size="17" font-style="italic">F</text>
  <text x="183" y="56"  font-family="serif" font-size="17" font-style="italic">C</text>
  <text x="195" y="272" font-family="serif" font-size="17" font-style="italic">G</text>
</svg>
