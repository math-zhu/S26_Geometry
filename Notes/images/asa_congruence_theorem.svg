<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 295">
  <!--
    Same scalene triangle as congruent_triangles.svg:
    ABC: A=(50,200), B=(220,200), C=(70,70)
    DEF: 180-deg rotation of ABC shifted right
         D=(457,113), E=(287,113), F=(437,243)

    ASA: angle A = angle D (single arc),
         AB = DE (1 tick),
         angle B = angle E (single arc)
  -->

  <!-- Triangle ABC (blue) -->
  <polygon points="50,200 220,200 70,70" fill="#ddeeff" stroke="#3366cc" stroke-width="2"/>
  <text x="34"  y="218" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="224" y="218" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="63"  y="58"  font-family="serif" font-size="17" font-style="italic">C</text>

  <!-- 1 tick on AB (midpoint (135,200), AB is horizontal → vertical tick) -->
  <line x1="135" y1="193" x2="135" y2="207" stroke="#3366cc" stroke-width="2"/>

  <!-- Angle arc at A: from point on AB (75,200) to point on AC (54,175) -->
  <path d="M 75,200 A 25,25 0 0,0 54,175" fill="none" stroke="#cc3333" stroke-width="1.8"/>
  <!-- Angle arc at B: from point on BA (195,200) to point on BC (201,184) -->
  <path d="M 195,200 A 25,25 0 0,1 201,184" fill="none" stroke="#cc3333" stroke-width="1.8"/>

  <!-- Congruence symbol -->
  <text x="240" y="152" font-family="serif" font-size="26">&#x2245;</text>

  <!-- Triangle DEF (orange) -->
  <polygon points="457,113 287,113 437,243" fill="#ffeedd" stroke="#cc6600" stroke-width="2"/>
  <text x="459" y="110" font-family="serif" font-size="17" font-style="italic">A'</text>
  <text x="267" y="110" font-family="serif" font-size="17" font-style="italic">B'</text>
  <text x="429" y="261" font-family="serif" font-size="17" font-style="italic">C'</text>

  <!-- 1 tick on DE (midpoint (372,113), DE is horizontal → vertical tick) -->
  <line x1="372" y1="106" x2="372" y2="120" stroke="#cc6600" stroke-width="2"/>

  <!-- Angle arc at D: from point on DE (432,113) to point on DF (453,138) -->
  <path d="M 432,113 A 25,25 0 0,0 453,138" fill="none" stroke="#cc3333" stroke-width="1.8"/>
  <!-- Angle arc at E: from point on ED (312,113) to point on EF (306,129) -->
  <path d="M 312,113 A 25,25 0 0,1 306,129" fill="none" stroke="#cc3333" stroke-width="1.8"/>

  <!-- Caption -->
  <text x="260" y="278" text-anchor="middle" font-family="serif" font-size="15">&#x2220;A = &#x2220;A',&#160;&#160;AB = A'B',&#160;&#160;&#x2220;B = &#x2220;B'&#160;&#160;&#x27F9;&#160;&#160;&#x25B3;ABC &#x2245; &#x25B3;A'B'C'</text>
</svg>
