<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310">
  <!-- Byrne-style: Prop I.10 — Bisect a finite straight line -->
  <!-- Line AB: A=(80,250), B=(340,250) -->
  <line x1="80" y1="250" x2="340" y2="250" stroke="#cc3333" stroke-width="3"/>
  <!-- Equilateral triangle ACB above (C at apex) -->
  <!-- C = midAB elevated: (210, 250 - 260*sin60/2) wait AB=260, so C = (210, 250-225) = (210,25) -- too high -->
  <!-- Use a smaller equilateral: same AB, apex C = (210, 250 - 260*0.866) = (210, 25) — let's keep it but shift up viewbox -->
  <!-- Actually let me use AB = 200: A=(110,250), B=(310,250), C=(210, 250-173)=(210,77) -->
  <line x1="110" y1="250" x2="340" y2="250" stroke="#cc3333" stroke-width="3"/>
  <!-- Redo with A=110,B=310 -->
  <polygon points="110,250 310,250 210,77" fill="#fffacc" stroke="none"/>
  <!-- Sides AC, BC — blue and green, AB already drawn in red below -->
  <line x1="110" y1="250" x2="210"  y2="77" stroke="#3366cc" stroke-width="2.2"/>
  <line x1="310" y1="250" x2="210"  y2="77" stroke="#228833" stroke-width="2.2"/>
  <!-- AB in red on top -->
  <line x1="110" y1="250" x2="310" y2="250" stroke="#cc3333" stroke-width="2.5"/>
  <!-- Bisector from C to D (midpoint of AB) -->
  <line x1="210" y1="77" x2="210" y2="266" stroke="#cc3333" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Midpoint D -->
  <circle cx="210" cy="250" r="4.5" fill="#cc3333"/>
  <!-- Right angle mark at D -->
  <rect x="213" y="237" width="9" height="9" fill="none" stroke="#555" stroke-width="1.2"/>
  <!-- Tick marks on AD and DB -->
  <line x1="158" y1="244" x2="162" y2="256" stroke="#cc3333" stroke-width="2"/>
  <line x1="258" y1="244" x2="262" y2="256" stroke="#cc3333" stroke-width="2"/>
  <!-- Vertex dots -->
  <circle cx="110" cy="250" r="3.5" fill="#333"/>
  <circle cx="310" cy="250" r="3.5" fill="#333"/>
  <circle cx="210" cy="77"  r="3.5" fill="#333"/>
  <!-- Labels -->
  <text x="92"  y="270" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="315" y="270" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="203" y="67"  font-family="serif" font-size="17" font-style="italic">C</text>
  <text x="214" y="280" font-family="serif" font-size="17" font-style="italic">D</text>
</svg>
