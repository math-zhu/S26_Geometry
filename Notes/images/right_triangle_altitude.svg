<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300">
  <!-- Right triangle: C=(60,250) right angle, A=(360,250), B=(60,50) -->
  <!-- CA horizontal (length 300), CB vertical (length 200)          -->
  <!-- Hypotenuse AB. Foot of altitude from C to AB: H≈(152,112)    -->
  <!-- t = 9/13: H = (360 - 9/13*300, 250 - 9/13*200) = (152, 112) -->

  <!-- Sub-triangle AHC (light blue) -->
  <polygon points="360,250 152,112 60,250" fill="#ddeeff" stroke="none"/>
  <!-- Sub-triangle CHB (light orange) -->
  <polygon points="60,250 152,112 60,50" fill="#ffeedd" stroke="none"/>

  <!-- Triangle sides -->
  <line x1="360" y1="250" x2="60"  y2="50"  stroke="black" stroke-width="2"/>
  <line x1="60"  y1="50"  x2="60"  y2="250" stroke="black" stroke-width="2"/>
  <line x1="60"  y1="250" x2="360" y2="250" stroke="black" stroke-width="2"/>

  <!-- Altitude CH -->
  <line x1="60" y1="250" x2="152" y2="112" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Right-angle mark at C=(60,250): between CA (→) and CB (↑) -->
  <polyline points="70,250 70,240 60,240" fill="none" stroke="black" stroke-width="1.5"/>

  <!-- Right-angle mark at H=(152,112) perpendicular to AB             -->
  <!-- HA unit ≈ (0.833, 0.553), HC unit ≈ (-0.555, 0.832)           -->
  <!-- p1 = H + 10*HA = (160,118), p3 = H + 10*HC = (147,120)        -->
  <!-- corner = p1 + 10*HC = (154,126)                                -->
  <polyline points="160,118 155,126 147,120" fill="none" stroke="black" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="366" y="265" font-family="serif" font-style="italic" font-size="18">A</text>
  <text x="44"  y="44"  font-family="serif" font-style="italic" font-size="18">B</text>
  <text x="36"  y="265" font-family="serif" font-style="italic" font-size="18">C</text>
  <text x="155" y="104" font-family="serif" font-style="italic" font-size="18">H</text>

  <!-- Sub-triangle labels (small, inside each region) -->
  <text x="195" y="215" font-family="serif" font-size="13" fill="#3366cc" text-anchor="middle">△AHC</text>
  <text x="72"  y="170" font-family="serif" font-size="13" fill="#cc6600" text-anchor="middle">△CHB</text>
</svg>
