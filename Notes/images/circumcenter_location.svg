<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400">
  <!-- Obtuse triangle A=(110,270), B=(310,270), C=(160,196)
       Angle at C ≈ 97° (obtuse)
       Circumcenter O=(210,284), R≈101 — outside triangle, below BC
  -->

  <!-- Circumscribed circle -->
  <circle cx="210" cy="284" r="101" fill="#eef4ff" stroke="#3366cc" stroke-width="1.8"/>

  <!-- Triangle sides -->
  <line x1="110" y1="270" x2="310" y2="270" stroke="#3366cc" stroke-width="2"/>
  <line x1="110" y1="270" x2="160" y2="196" stroke="#3366cc" stroke-width="2"/>
  <line x1="310" y1="270" x2="160" y2="196" stroke="#3366cc" stroke-width="2"/>

  <!-- ℓ1: perp bisector of AB — vertical x=210 (red dashed) -->
  <line x1="210" y1="80" x2="210" y2="380" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="7,4"/>
  <!-- right-angle mark at midAB=(210,270) -->
  <rect x="210" y="261" width="9" height="9" fill="none" stroke="#cc3333" stroke-width="1.3"/>
  <circle cx="210" cy="270" r="2.2" fill="#cc3333"/>
  <text x="215" y="258" font-family="serif" font-size="13" font-style="italic" fill="#cc3333">&#x2113;&#x2081;</text>

  <!-- ℓ2: perp bisector of BC — slope=-75/37, through mid=(235,233) (green dashed)
       at x=175: y=233+(-75/37)*(175-235)=233+121.6=354.6
       at x=262: y=233+(-75/37)*(262-235)=233-54.7=178.3
  -->
  <line x1="175" y1="355" x2="262" y2="178" stroke="#228833" stroke-width="1.5" stroke-dasharray="7,4"/>
  <circle cx="235" cy="233" r="2.2" fill="#228833"/>
  <text x="240" y="228" font-family="serif" font-size="13" font-style="italic" fill="#228833">&#x2113;&#x2082;</text>

  <!-- Vertices -->
  <circle cx="110" cy="270" r="3.5" fill="#3366cc"/>
  <circle cx="310" cy="270" r="3.5" fill="#3366cc"/>
  <circle cx="160" cy="196" r="3.5" fill="#3366cc"/>
  <text x="92"  y="288" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="314" y="288" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="153" y="186" font-family="serif" font-size="17" font-style="italic">C</text>

  <!-- Obtuse angle mark at C -->
  <!-- CA direction: (110-160,270-196)=(-50,74), unit≈(-0.560,0.829)
       CB direction: (310-160,270-196)=(150,74), unit≈(0.897,0.443) -->
  <path d="M 148,217 A 22,22 0 0,0 175,207" fill="none" stroke="#993399" stroke-width="1.8"/>
  <text x="148" y="237" font-family="serif" font-size="13" fill="#993399">&gt;90°</text>

  <!-- Circumcenter O — outside triangle -->
  <circle cx="210" cy="284" r="4" fill="#cc3333"/>
  <text x="216" y="281" font-family="serif" font-size="16" font-style="italic" fill="#cc3333">O</text>

  <!-- Radii OA, OB, OC dashed -->
  <line x1="210" y1="284" x2="110" y2="270" stroke="#cc3333" stroke-width="1.1" stroke-dasharray="4,3"/>
  <line x1="210" y1="284" x2="310" y2="270" stroke="#cc3333" stroke-width="1.1" stroke-dasharray="4,3"/>
  <line x1="210" y1="284" x2="160" y2="196" stroke="#cc3333" stroke-width="1.1" stroke-dasharray="4,3"/>

  <!-- Caption -->
  <text x="210" y="395" text-anchor="middle" font-family="serif" font-size="14">
    Obtuse triangle: circumcenter O lies outside the triangle
  </text>
</svg>
