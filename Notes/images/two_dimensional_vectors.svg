<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300">
  <defs>
    <marker id="arrowAxis" markerWidth="9" markerHeight="7" refX="9" refY="3.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" fill="black"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="10" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 4, 0 8" fill="#3366cc"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="10" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 4, 0 8" fill="#cc3333"/>
    </marker>
  </defs>

  <!-- origin: (180, 235), scale: 50px/unit -->
  <!-- x: -3→30, -2→80, -1→130, 0→180, 1→230, 2→280, 3→330, 4→380 -->
  <!-- y: -1→285, 0→235, 1→185, 2→135, 3→85 -->

  <!-- X axis -->
  <line x1="20" y1="235" x2="415" y2="235" stroke="black" stroke-width="1.5"
        marker-end="url(#arrowAxis)"/>
  <text x="420" y="240" font-family="serif" font-size="16" font-style="italic">x</text>

  <!-- Y axis -->
  <line x1="180" y1="290" x2="180" y2="15" stroke="black" stroke-width="1.5"
        marker-end="url(#arrowAxis)"/>
  <text x="173" y="11" font-family="serif" font-size="16" font-style="italic">y</text>

  <!-- Origin label -->
  <text x="162" y="252" font-family="serif" font-size="14">O</text>

  <!-- Tick marks on x-axis -->
  <line x1="80"  y1="230" x2="80"  y2="240" stroke="black" stroke-width="1.2"/>
  <text x="80"  y="253" text-anchor="middle" font-family="serif" font-size="13">−2</text>
  <line x1="130" y1="230" x2="130" y2="240" stroke="black" stroke-width="1.2"/>
  <text x="130" y="253" text-anchor="middle" font-family="serif" font-size="13">−1</text>
  <line x1="230" y1="230" x2="230" y2="240" stroke="black" stroke-width="1.2"/>
  <text x="230" y="253" text-anchor="middle" font-family="serif" font-size="13">1</text>
  <line x1="280" y1="230" x2="280" y2="240" stroke="black" stroke-width="1.2"/>
  <text x="280" y="253" text-anchor="middle" font-family="serif" font-size="13">2</text>
  <line x1="330" y1="230" x2="330" y2="240" stroke="black" stroke-width="1.2"/>
  <text x="330" y="253" text-anchor="middle" font-family="serif" font-size="13">3</text>
  <line x1="380" y1="230" x2="380" y2="240" stroke="black" stroke-width="1.2"/>
  <text x="380" y="253" text-anchor="middle" font-family="serif" font-size="13">4</text>

  <!-- Tick marks on y-axis -->
  <line x1="175" y1="285" x2="185" y2="285" stroke="black" stroke-width="1.2"/>
  <text x="167" y="290" text-anchor="end" font-family="serif" font-size="13">−1</text>
  <line x1="175" y1="185" x2="185" y2="185" stroke="black" stroke-width="1.2"/>
  <text x="167" y="190" text-anchor="end" font-family="serif" font-size="13">1</text>
  <line x1="175" y1="135" x2="185" y2="135" stroke="black" stroke-width="1.2"/>
  <text x="167" y="140" text-anchor="end" font-family="serif" font-size="13">2</text>
  <line x1="175" y1="85"  x2="185" y2="85"  stroke="black" stroke-width="1.2"/>
  <text x="167" y="90"  text-anchor="end" font-family="serif" font-size="13">3</text>

  <!-- Vector v1 (blue): from (1, 0)=(230, 235) to (3, 2)=(330, 135) -->
  <circle cx="230" cy="235" r="4.5" fill="#3366cc"/>
  <line x1="230" y1="235" x2="330" y2="135" stroke="#3366cc" stroke-width="2.5"
        marker-end="url(#arrowBlue)"/>
  <text x="296" y="170" font-family="serif" font-size="15" font-style="italic"
        fill="#3366cc">v&#x2081;</text>

  <!-- Vector v2 (red): from (0, 1)=(180, 185) to (-2, 3)=(80, 85) -->
  <circle cx="180" cy="185" r="4.5" fill="#cc3333"/>
  <line x1="180" y1="185" x2="80" y2="85" stroke="#cc3333" stroke-width="2.5"
        marker-end="url(#arrowRed)"/>
  <text x="155" y="200" font-family="serif" font-size="15" font-style="italic"
        fill="#cc3333">v&#x2082;</text>
</svg>
