<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310">

  <!-- Triangle ACD: light blue fill -->
  <polygon points="60,240 155,70 305,95" fill="#ddeeff" stroke="none"/>
  <!-- Triangle ADB: light orange fill -->
  <polygon points="60,240 305,95 420,240" fill="#ffeedd" stroke="none"/>

  <!-- Direct path AB: green, thick -->
  <line x1="60" y1="240" x2="420" y2="240" stroke="#228833" stroke-width="2.5"/>

  <!-- Auxiliary segment AD: dashed gray -->
  <line x1="60" y1="240" x2="305" y2="95" stroke="#888888" stroke-width="1.8" stroke-dasharray="7,4"/>

  <!-- Broken path A→C→D→B: blue/orange -->
  <line x1="60"  y1="240" x2="155" y2="70"  stroke="#3366cc" stroke-width="2.2"/>
  <line x1="155" y1="70"  x2="305" y2="95"  stroke="#3366cc" stroke-width="2.2"/>
  <line x1="305" y1="95"  x2="420" y2="240" stroke="#cc6600" stroke-width="2.2"/>

  <!-- Triangle borders (light) -->
  <line x1="60"  y1="240" x2="155" y2="70"  stroke="#3366cc" stroke-width="1.2" stroke-dasharray="none"/>
  <line x1="155" y1="70"  x2="305" y2="95"  stroke="#3366cc" stroke-width="1.2"/>
  <line x1="305" y1="95"  x2="420" y2="240" stroke="#cc6600" stroke-width="1.2"/>

  <!-- Points -->
  <circle cx="60"  cy="240" r="4" fill="black"/>
  <circle cx="420" cy="240" r="4" fill="black"/>
  <circle cx="155" cy="70"  r="4" fill="#3366cc"/>
  <circle cx="305" cy="95"  r="4" fill="#cc6600"/>

  <!-- Labels -->
  <text x="42"  y="258" font-family="serif" font-size="18" font-style="italic">A</text>
  <text x="424" y="258" font-family="serif" font-size="18" font-style="italic">B</text>
  <text x="147" y="58"  font-family="serif" font-size="18" font-style="italic">C</text>
  <text x="309" y="84"  font-family="serif" font-size="18" font-style="italic">D</text>

  <!-- Edge labels -->
  <text x="91"  y="168" font-family="serif" font-size="14" font-style="italic" fill="#3366cc">AC</text>
  <text x="216" y="72"  font-family="serif" font-size="14" font-style="italic" fill="#3366cc">CD</text>
  <text x="370" y="168" font-family="serif" font-size="14" font-style="italic" fill="#cc6600">DB</text>
  <text x="164" y="186" font-family="serif" font-size="13" font-style="italic" fill="#666666">AD</text>
  <text x="225" y="258" font-family="serif" font-size="14" font-style="italic" fill="#228833">AB</text>

  <!-- Step annotations -->
  <text x="100" y="295" font-family="serif" font-size="13" fill="#3366cc">&#x25B3;ACD: AC+CD &gt; AD</text>
  <text x="270" y="295" font-family="serif" font-size="13" fill="#cc6600">&#x25B3;ADB: AD+DB &gt; AB</text>

</svg>
