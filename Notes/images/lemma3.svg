<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Parallelogram ABCD -->
  
  <!-- Point A (bottom left) -->
  <circle cx="60" cy="220" r="4" fill="black"/>
  <text x="45" y="240" font-size="16" font-family="serif" font-style="italic">A</text>
  
  <!-- Point B (bottom right) -->
  <circle cx="300" cy="220" r="4" fill="black"/>
  <text x="305" y="240" font-size="16" font-family="serif" font-style="italic">B</text>
  
  <!-- Point C (top left) -->
  <circle cx="100" cy="60" r="4" fill="black"/>
  <text x="85" y="50" font-size="16" font-family="serif" font-style="italic">C</text>
  
  <!-- Point D (top right) -->
  <circle cx="340" cy="60" r="4" fill="black"/>
  <text x="345" y="50" font-size="16" font-family="serif" font-style="italic">D</text>
  
  <!-- Parallelogram sides -->
  <line x1="60" y1="220" x2="300" y2="220" stroke="black" stroke-width="2"/>
  <line x1="60" y1="220" x2="100" y2="60" stroke="black" stroke-width="2"/>
  <line x1="300" y1="220" x2="340" y2="60" stroke="black" stroke-width="2"/>
  <line x1="100" y1="60" x2="340" y2="60" stroke="black" stroke-width="2"/>
  
  <!-- Midpoint E on AB -->
  <circle cx="180" cy="220" r="4" fill="red"/>
  <text x="175" y="240" font-size="16" font-family="serif" font-style="italic">E</text>
  
  <!-- Midpoint F on AC -->
  <circle cx="80" cy="140" r="4" fill="red"/>
  <text x="60" y="145" font-size="16" font-family="serif" font-style="italic">F</text>
  
  <!-- Line parallel to AB through F (horizontal line at y=140) -->
  <line x1="80" y1="140" x2="320" y2="140" stroke="blue" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Line parallel to AC through E (from E upward with same slope as AC) -->
  <line x1="180" y1="220" x2="220" y2="60" stroke="green" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Mark the intersection point O (center) -->
  <circle cx="200" cy="140" r="4" fill="purple"/>
  <text x="205" y="135" font-size="16" font-family="serif" font-style="italic">O</text>
  
  <!-- Point G on BD (intersection of horizontal line through F with BD) -->
  <circle cx="320" cy="140" r="4" fill="orange"/>
  <text x="325" y="135" font-size="16" font-family="serif" font-style="italic">G</text>
  
  <!-- Point H on CD (intersection of line through E parallel to AC with CD) -->
  <circle cx="220" cy="60" r="4" fill="orange"/>
  <text x="225" y="55" font-size="16" font-family="serif" font-style="italic">H</text>
  
  <!-- Additional dashed lines: AO, EG, OD -->
  <!-- Line AO -->
  <line x1="60" y1="220" x2="200" y2="140" stroke="red" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Line EG -->
  <line x1="180" y1="220" x2="320" y2="140" stroke="red" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Line OD -->
  <line x1="200" y1="140" x2="340" y2="60" stroke="red" stroke-width="2" stroke-dasharray="3,3"/>
</svg>
