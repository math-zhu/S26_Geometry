<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300">
  <!-- Triangle ABC: A=(210,40), B=(60,260), C=(390,260) -->
  <!-- Midpoints: D=(225,260) on BC, E=(300,150) on CA, F=(135,150) on AB -->
  <!-- Centroid P=(220,187) approx: average of vertices -->

  <!-- Triangle sides -->
  <line x1="210" y1="40" x2="60" y2="260" stroke="black" stroke-width="2"/>
  <line x1="60" y1="260" x2="390" y2="260" stroke="black" stroke-width="2"/>
  <line x1="390" y1="260" x2="210" y2="40" stroke="black" stroke-width="2"/>

  <!-- Medians: A->D, B->E, C->F -->
  <line x1="210" y1="40" x2="225" y2="260" stroke="black" stroke-width="1.5"/>
  <line x1="60" y1="260" x2="300" y2="150" stroke="black" stroke-width="1.5"/>
  <line x1="390" y1="260" x2="135" y2="150" stroke="black" stroke-width="1.5"/>

  <!-- Centroid P dot -->
  <circle cx="220" cy="187" r="3" fill="black"/>

  <!-- Vertex labels -->
  <text x="202" y="28" font-family="serif" font-style="italic" font-size="18">A</text>
  <text x="40" y="274" font-family="serif" font-style="italic" font-size="18">B</text>
  <text x="396" y="274" font-family="serif" font-style="italic" font-size="18">C</text>
  <!-- Midpoint labels -->
  <text x="222" y="276" font-family="serif" font-style="italic" font-size="18">D</text>
  <text x="308" y="152" font-family="serif" font-style="italic" font-size="18">E</text>
  <text x="112" y="152" font-family="serif" font-style="italic" font-size="18">F</text>
  <!-- P label -->
  <text x="228" y="185" font-family="serif" font-style="italic" font-size="18">P</text>
</svg>
