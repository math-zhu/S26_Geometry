<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380">
  <!-- Triangle A=(80,300), B=(340,300), C=(200,80)
       Circumcenter O:
         midAB=(210,300), perpBisAB is x=210
         midAC=(140,190), slope AC=(300-80)/(80-200)=-220/120=-11/6
           perp slope=6/11; line: y-190=(6/11)(x-140)
           at x=210: y=190+(6/11)*70=190+38.2=228.2 ≈ 228
         R=dist(210,228,80,300)=sqrt(130^2+72^2)=sqrt(16900+5184)=sqrt(22084)≈148.6
         Let's use exact: O=(210,228), R≈149
  -->
  <!-- Circumscribed circle -->
  <circle cx="210" cy="228" r="149" fill="#eef4ff" stroke="#3366cc" stroke-width="2"/>

  <!-- Triangle sides -->
  <line x1="80"  y1="300" x2="340" y2="300" stroke="#3366cc" stroke-width="2"/>
  <line x1="80"  y1="300" x2="200" y2="80"  stroke="#3366cc" stroke-width="2"/>
  <line x1="340" y1="300" x2="200" y2="80"  stroke="#3366cc" stroke-width="2"/>

  <!-- Vertices -->
  <circle cx="80"  cy="300" r="3.5" fill="#3366cc"/>
  <circle cx="340" cy="300" r="3.5" fill="#3366cc"/>
  <circle cx="200" cy="80"  r="3.5" fill="#3366cc"/>
  <text x="60"  y="318" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="344" y="318" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="193" y="70"  font-family="serif" font-size="17" font-style="italic">C</text>

  <!-- Perpendicular bisector of AB: x=210, mid=(210,300) -->
  <line x1="210" y1="90"  x2="210" y2="375" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="7,4"/>
  <rect x="210" y="292" width="9" height="8" fill="none" stroke="#cc3333" stroke-width="1.3"/>
  <circle cx="210" cy="300" r="2.5" fill="#cc3333"/>

  <!-- Perpendicular bisector of AC: mid=(140,190), slope=6/11 -->
  <!-- line from (80,157) to (300,277): at x=80: y=190+(6/11)*(80-140)=190-32.7=157.3
       at x=310: y=190+(6/11)*(310-140)=190+92.7=282.7 -->
  <line x1="70" y1="152" x2="310" y2="279" stroke="#228833" stroke-width="1.5" stroke-dasharray="7,4"/>
  <!-- right angle mark at midAC=(140,190) -->
  <!-- AC direction: (200-80,80-300)=(120,-220) unit: (0.480,-0.877)
       perp: (0.877,0.480)
       mark: from mid, 8px in AC direction and 8px in perp direction -->
  <circle cx="140" cy="190" r="2.5" fill="#228833"/>

  <!-- Perpendicular bisector of BC: mid=(270,190), slope BC=(80-300)/(200-340)=(-220)/(-140)=11/7
       perp slope=-7/11; line: y-190=(-7/11)(x-270)
       at x=100: y=190+(-7/11)*(-170)=190+108.2=298.2
       at x=360: y=190+(-7/11)*(90)=190-57.3=132.7 -->
  <line x1="100" y1="298" x2="360" y2="133" stroke="#993399" stroke-width="1.5" stroke-dasharray="7,4"/>
  <circle cx="270" cy="190" r="2.5" fill="#993399"/>

  <!-- Circumcenter O -->
  <circle cx="210" cy="228" r="4" fill="#cc3333"/>
  <text x="216" y="224" font-family="serif" font-size="16" font-style="italic" fill="#cc3333">O</text>

  <!-- Radii OA, OB, OC dashed -->
  <line x1="210" y1="228" x2="80"  y2="300" stroke="#cc3333" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="210" y1="228" x2="340" y2="300" stroke="#cc3333" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="210" y1="228" x2="200" y2="80"  stroke="#cc3333" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Caption -->
  <text x="200" y="375" text-anchor="middle" font-family="serif" font-size="14">
    Circumcenter O = intersection of perpendicular bisectors
  </text>
</svg>
