<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300">
  <!-- Triangle A=(170,55), B=(60,245), C=(360,245)
       a=BC=300, b=CA=sqrt(190²+190²)≈269, c=AB=sqrt(110²+190²)≈220
       Circumcenter: midBC=(210,245), perp bisector x=210
         midAC=(265,150), slope AC=(245-55)/(360-170)=190/190=1, perp=-1
         line: y-150=-(x-265) → at x=210: y=150+55=205 → O=(210,205)
         R=dist(210,205,60,245)=sqrt(150²+40²)=sqrt(22500+1600)=sqrt(24100)≈155 — too big
       Use smaller: A=(190,75), B=(80,240), C=(340,240)
         midBC=(210,240), perp bisector x=210
         midAC=(265,157.5), slope AC=(240-75)/(340-190)=165/150=1.1, perp=-1/1.1=-0.909
         at x=210: y=157.5+(-0.909)*(210-265)=157.5+50=207.5 → O=(210,208)
         R=dist(210,208,80,240)=sqrt(130²+32²)=sqrt(16900+1024)=sqrt(17924)≈134
       Incenter: a=BC=260, b=CA=sqrt(150²+165²)≈223, c=AB=sqrt(110²+165²)≈198
         s=(260+223+198)/2=340.5
         I_x=(260*190+223*80+198*340)/(260+223+198)=(49400+17840+67320)/681=134560/681≈198
         I_y=(260*75+223*240+198*240)/(681)=(19500+53520+47520)/681=120540/681≈177
         r=Area/s; Area=0.5*260*165=21450; r=21450/340.5≈63
  -->

  <!-- Triangle -->
  <polygon points="190,75 80,240 340,240" fill="#eef4ff" stroke="#3366cc" stroke-width="2"/>

  <!-- Vertices -->
  <circle cx="190" cy="75"  r="3.5" fill="#3366cc"/>
  <circle cx="80"  cy="240" r="3.5" fill="#3366cc"/>
  <circle cx="340" cy="240" r="3.5" fill="#3366cc"/>
  <text x="183" y="65"  font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="62"  y="258" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="344" y="258" font-family="serif" font-size="17" font-style="italic">C</text>

  <!-- Side labels -->
  <text x="224" y="260" font-family="serif" font-size="15" font-style="italic">a</text>
  <text x="276" y="167" font-family="serif" font-size="15" font-style="italic">b</text>
  <text x="113" y="167" font-family="serif" font-size="15" font-style="italic">c</text>

  <!-- Angle arcs -->
  <!-- A at (190,75): AB unit=(-0.500,0.866); AC unit=(0.688,0.726)
       22px toward B: (179,94); 22px toward C: (205,91) sweep=0 -->
  <path d="M 179,94 A 22,22 0 0,0 205,91" fill="none" stroke="#cc6600" stroke-width="1.6"/>
  <text x="183" y="109" font-family="serif" font-size="14" font-style="italic" fill="#cc6600">A</text>

  <!-- B at (80,240): BA unit=(0.500,-0.866); BC unit=(1,0)
       22px toward A: (91,221); 22px toward C: (102,240) sweep=1 -->
  <path d="M 91,221 A 22,22 0 0,1 102,240" fill="none" stroke="#cc6600" stroke-width="1.6"/>
  <text x="100" y="228" font-family="serif" font-size="14" font-style="italic" fill="#cc6600">B</text>

  <!-- C at (340,240): CA unit=(-0.688,0.726) reversed=(-0.688,-0.726); CB unit=(-1,0)
       22px toward A: (325,224); 22px toward B: (318,240) sweep=0 -->
  <path d="M 325,224 A 22,22 0 0,0 318,240" fill="none" stroke="#cc6600" stroke-width="1.6"/>
  <text x="310" y="228" font-family="serif" font-size="14" font-style="italic" fill="#cc6600">C</text>

  <!-- Caption -->
  <text x="220" y="292" text-anchor="middle" font-family="serif" font-size="13" fill="#333">
    a=BC,&#160; b=CA,&#160; c=AB
  </text>
</svg>
