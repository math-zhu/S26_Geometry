<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310">
  <!--
    Three cases for the Inscribed Angle Theorem proof.
    Each circle has R=90.

    CASE 1 (left): O is inside angle APB.
      Center O=(110,170), R=90.
      A at 200°: x=110+90cos200°=110-84.6=25, y=170+90sin200°=170-30.8=139 → A=(25,139)
      B at 340°: x=110+90cos340°=110+84.6=195, y=170+90sin340°=170-30.8=139 → B=(195,139)
      P at 90°:  x=110, y=170-90=80 → P=(110,80)
      OA extended to D on circle at 20°: x=110+90cos20°=110+84.6=195 (same as B)... 
      For case 1: draw diameter through P and O. D=(110,170+90)=(110,260).
      PO extended hits circle at D=(110,260).
  -->

  <!-- ===== CASE 1: O inside angle ===== -->
  <circle cx="110" cy="170" r="90" fill="#eef4ff" stroke="#3366cc" stroke-width="1.8"/>
  <circle cx="110" cy="170" r="3" fill="black"/>
  <text x="115" y="175" font-family="serif" font-size="14" font-style="italic">O</text>

  <!-- A=(25,139), B=(195,139), P=(110,80) -->
  <circle cx="25"  cy="139" r="3" fill="#3366cc"/>
  <circle cx="195" cy="139" r="3" fill="#3366cc"/>
  <circle cx="110" cy="80"  r="3" fill="#cc6600"/>
  <text x="8"   y="138" font-family="serif" font-size="14" font-style="italic" fill="#3366cc">A</text>
  <text x="199" y="138" font-family="serif" font-size="14" font-style="italic" fill="#3366cc">B</text>
  <text x="104" y="70"  font-family="serif" font-size="14" font-style="italic" fill="#cc6600">P</text>

  <!-- Diameter PD through O -->
  <circle cx="110" cy="260" r="3" fill="#888"/>
  <text x="113" y="275" font-family="serif" font-size="14" font-style="italic" fill="#888">D</text>
  <line x1="110" y1="80" x2="110" y2="260" stroke="#888" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- PA, PB lines -->
  <line x1="110" y1="80" x2="25"  y2="139" stroke="#cc6600" stroke-width="1.8"/>
  <line x1="110" y1="80" x2="195" y2="139" stroke="#cc6600" stroke-width="1.8"/>
  <!-- OA, OB lines -->
  <line x1="110" y1="170" x2="25"  y2="139" stroke="#3366cc" stroke-width="1.8"/>
  <line x1="110" y1="170" x2="195" y2="139" stroke="#3366cc" stroke-width="1.8"/>

  <!-- Angle α at P-left (∠APD) and 2α at O-left (∠AOD) -->
  <!-- isoc triangle OPA: OA=OP=R, so ∠OAP=∠OPA=β₁; ∠AOD=2β₁ -->
  <!-- arc at P for ∠APD -->
  <path d="M 104,97 A 18,18 0 0,0 96,88" fill="none" stroke="#cc6600" stroke-width="1.5"/>
  <!-- arc at P for ∠BPD -->
  <path d="M 116,97 A 18,18 0 0,1 124,88" fill="none" stroke="#cc6600" stroke-width="1.5"/>

  <text x="62"  y="100" font-family="serif" font-size="13" fill="#cc6600">&#x3B2;&#x2081;</text>
  <text x="120" y="100" font-family="serif" font-size="13" fill="#cc6600">&#x3B2;&#x2082;</text>

  <text x="55" y="290" font-family="serif" font-size="13" text-anchor="middle" fill="#555">Case 1: O inside</text>


  <!-- ===== CASE 2 (middle): O on PA ===== -->
  <!--
    Center O=(310,170), R=90.
    P at 180°: P=(220,170).
    A is diametrically opposite P: A=(400,170).
    B at 50°: x=310+90cos50°=310+57.9=368, y=170-90sin50°=170-68.9=101 → B=(368,101)
  -->
  <circle cx="310" cy="170" r="90" fill="#fff8ee" stroke="#cc6600" stroke-width="1.8"/>
  <circle cx="310" cy="170" r="3" fill="black"/>
  <text x="315" y="168" font-family="serif" font-size="14" font-style="italic">O</text>

  <circle cx="220" cy="170" r="3" fill="#cc6600"/>
  <circle cx="400" cy="170" r="3" fill="#3366cc"/>
  <circle cx="368" cy="101" r="3" fill="#3366cc"/>
  <text x="206" y="168" font-family="serif" font-size="14" font-style="italic" fill="#cc6600">P</text>
  <text x="403" y="168" font-family="serif" font-size="14" font-style="italic" fill="#3366cc">A</text>
  <text x="371" y="98"  font-family="serif" font-size="14" font-style="italic" fill="#3366cc">B</text>

  <!-- PA is diameter, PB chord -->
  <line x1="220" y1="170" x2="400" y2="170" stroke="#3366cc" stroke-width="1.8"/>
  <line x1="220" y1="170" x2="368" y2="101" stroke="#cc6600" stroke-width="1.8"/>
  <!-- OB radius -->
  <line x1="310" y1="170" x2="368" y2="101" stroke="#3366cc" stroke-width="1.8"/>

  <!-- ∠APB = ∠BPO = β (inscribed) -->
  <!-- PO direction: right (angle 0). PB direction: (368-220,101-170)/|PB|=(148,-69)/165=(0.897,-0.418) angle≈-25° -->
  <!-- arc from PO to PB at P, radius 22 -->
  <!-- point 22px along PO from P: (242,170); point 22px along PB: 220+22*0.897=240, 170+22*(-0.418)=161 -->
  <path d="M 242,170 A 22,22 0 0,0 240,161" fill="none" stroke="#cc6600" stroke-width="1.5"/>
  <text x="244" y="158" font-family="serif" font-size="13" fill="#cc6600">&#x3B2;</text>

  <!-- ∠BOA = 2β (central), arc at O -->
  <!-- OA direction: right (0°). OB direction: (368-310,101-170)/90=(58,-69)/90=(0.644,-0.767) angle≈-50° -->
  <!-- 22px along OA: (332,170); 22px along OB: 310+22*0.644=324, 170+22*(-0.767)=153 -->
  <path d="M 332,170 A 22,22 0 0,0 324,153" fill="none" stroke="#3366cc" stroke-width="1.5"/>
  <text x="332" y="155" font-family="serif" font-size="13" fill="#3366cc">2&#x3B2;</text>

  <text x="310" y="290" font-family="serif" font-size="13" text-anchor="middle" fill="#555">Case 2: O on PA</text>


  <!-- ===== CASE 3 (right): O outside angle ===== -->
  <!--
    Center O=(500,170), R=90.
    P at 150°: x=500+90cos150°=500-78=422, y=170+90sin150°=170+45=215 → P=(422,215)
    A at 240°: x=500+90cos240°=500-45=455, y=170+90sin240°=170-77.9=92 → A=(455,92)
      Wait let me pick cleaner angles.
    P at 160°: x=500+90cos160°=500-84.6=415, y=170+90sin160°=170+30.8=201 → P=(415,201)
    A at 220°: x=500+90cos220°=500-68.9=431, y=170+90sin220°=170-57.9=112 → A=(431,112)
    B at 280°: x=500+90cos280°=500+15.6=516, y=170+90sin280°=170-88.6=81 → B=(516,81)
    O is outside ∠APB if A and B are on same side.
    
    Let me use: P at 130°, A at 200°, B at 340°.
    P: x=500+90cos130°=500-57.9=442, y=170+90sin130°=170+68.9=239 → P=(442,239) — too low
    
    Use: O=(500,155), R=90
    P at 110°: x=500+90cos110°=500-30.8=469, y=155+90sin110°=155+84.6=240 → P=(469,240)
    A at 190°: x=500+90cos190°=500-88.6=411, y=155+90sin190°=155-15.6=139 → A=(411,139)
    B at 310°: x=500+90cos310°=500+57.9=558, y=155+90sin310°=155-68.9=86 → B=(558,86)
    O is outside ∠APB (center on far side from the chord AB relative to P)
    
    For the outside case: use diameter through P. D is antipodal to P.
    D: x=500+90cos(110°+180°)=500+90cos290°=500+30.8=531, y=155+90sin290°=155-84.6=70 → D=(531,70)
  -->
  <circle cx="500" cy="155" r="90" fill="#f0fff0" stroke="#228833" stroke-width="1.8"/>
  <circle cx="500" cy="155" r="3" fill="black"/>
  <text x="505" y="153" font-family="serif" font-size="14" font-style="italic">O</text>

  <circle cx="469" cy="240" r="3" fill="#cc6600"/>
  <circle cx="411" cy="139" r="3" fill="#3366cc"/>
  <circle cx="558" cy="86"  r="3" fill="#3366cc"/>
  <text x="465" y="258" font-family="serif" font-size="14" font-style="italic" fill="#cc6600">P</text>
  <text x="393" y="138" font-family="serif" font-size="14" font-style="italic" fill="#3366cc">A</text>
  <text x="561" y="85"  font-family="serif" font-size="14" font-style="italic" fill="#3366cc">B</text>

  <!-- Diameter PD -->
  <circle cx="531" cy="70" r="3" fill="#888"/>
  <text x="534" y="67" font-family="serif" font-size="14" font-style="italic" fill="#888">D</text>
  <line x1="469" y1="240" x2="531" y2="70" stroke="#888" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- PA, PB -->
  <line x1="469" y1="240" x2="411" y2="139" stroke="#cc6600" stroke-width="1.8"/>
  <line x1="469" y1="240" x2="558" y2="86"  stroke="#cc6600" stroke-width="1.8"/>
  <!-- OA, OB -->
  <line x1="500" y1="155" x2="411" y2="139" stroke="#228833" stroke-width="1.8"/>
  <line x1="500" y1="155" x2="558" y2="86"  stroke="#228833" stroke-width="1.8"/>

  <!-- ∠APD at P (larger) and ∠BPD at P (smaller) with ∠APB = difference -->
  <!-- PD direction: (531-469,70-240)/|PD|=(62,-170)/180.8=(0.343,-0.940) angle≈-70°
       PA direction: (411-469,139-240)/|PA|=(-58,-101)/|PA|=(−0.497,−0.868) angle≈240° 
       PB direction: (558-469,86-240)/|PB|=(89,-154)/|PB|=(0.500,-0.866) angle≈-60°
       ∠BPD is small (about 10°), ∠APD is large. ∠APB = ∠APD - ∠BPD -->
  <!-- arc for ∠APD -->
  <path d="M 456,222 A 20,20 0 0,0 463,221" fill="none" stroke="#cc6600" stroke-width="1.5"/>
  <text x="436" y="218" font-family="serif" font-size="12" fill="#cc6600">&#x3B1;+&#x3B2;</text>
  <!-- arc for ∠BPD -->
  <path d="M 476,222 A 20,20 0 0,0 476,221" fill="none" stroke="#cc6600" stroke-width="1"/>
  <text x="478" y="219" font-family="serif" font-size="12" fill="#cc6600">&#x3B2;</text>

  <text x="500" y="295" font-family="serif" font-size="13" text-anchor="middle" fill="#555">Case 3: O outside angle</text>
</svg>
