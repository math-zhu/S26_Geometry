<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310">
  <!-- Byrne-style: Prop I.30 — Lines parallel to same line are parallel to each other -->
  <!-- Three horizontal parallel lines -->
  <!-- AB at y=80 -->
  <line x1="30" y1="80"  x2="390" y2="80"  stroke="#cc3333" stroke-width="2.2"/>
  <!-- CD at y=165 (middle line) -->
  <line x1="30" y1="165" x2="390" y2="165" stroke="#228833" stroke-width="2.2"/>
  <!-- EF at y=250 -->
  <line x1="30" y1="250" x2="390" y2="250" stroke="#3366cc" stroke-width="2.2"/>
  <!-- Transversal from (290,30) to (170,290) -->
  <!-- At y=80: t=(80-30)/260=50/260=0.192; x=290-0.192*120=290-23.1=266.9→G=(267,80) -->
  <!-- At y=165: t=(165-30)/260=135/260=0.519; x=290-0.519*120=290-62.3=227.7→H=(228,165) -->
  <!-- At y=250: t=(250-30)/260=220/260=0.846; x=290-0.846*120=290-101.5=188.5→K=(189,250) -->
  <line x1="288" y1="30" x2="172" y2="286" stroke="#555" stroke-width="2"/>
  <!-- Equal angle arcs at each intersection (all same-colored) -->
  <!-- At G=(267,80) -->
  <path d="M 244,80 A 23,23 0 0,0 252,100" fill="#fffacc" opacity="0.85" stroke="#cc8800" stroke-width="1.4"/>
  <!-- At H=(228,165) -->
  <path d="M 205,165 A 23,23 0 0,0 213,185" fill="#fffacc" opacity="0.85" stroke="#cc8800" stroke-width="1.4"/>
  <!-- At K=(189,250) -->
  <path d="M 166,250 A 23,23 0 0,0 174,270" fill="#fffacc" opacity="0.85" stroke="#cc8800" stroke-width="1.4"/>
  <!-- Tick marks on parallel lines (double ticks) -->
  <!-- AB ticks -->
  <line x1="148" y1="73" x2="152" y2="87" stroke="#cc3333" stroke-width="1.8"/>
  <line x1="154" y1="73" x2="158" y2="87" stroke="#cc3333" stroke-width="1.8"/>
  <!-- CD ticks -->
  <line x1="148" y1="158" x2="152" y2="172" stroke="#228833" stroke-width="1.8"/>
  <line x1="154" y1="158" x2="158" y2="172" stroke="#228833" stroke-width="1.8"/>
  <!-- EF ticks -->
  <line x1="148" y1="243" x2="152" y2="257" stroke="#3366cc" stroke-width="1.8"/>
  <line x1="154" y1="243" x2="158" y2="257" stroke="#3366cc" stroke-width="1.8"/>
  <!-- Intersection dots -->
  <circle cx="267" cy="80"  r="4" fill="#333"/>
  <circle cx="228" cy="165" r="4" fill="#333"/>
  <circle cx="189" cy="250" r="4" fill="#333"/>
  <!-- Labels -->
  <text x="14"  y="85"  font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="393" y="85"  font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="14"  y="170" font-family="serif" font-size="17" font-style="italic">C</text>
  <text x="393" y="170" font-family="serif" font-size="17" font-style="italic">D</text>
  <text x="14"  y="255" font-family="serif" font-size="17" font-style="italic">E</text>
  <text x="393" y="255" font-family="serif" font-size="17" font-style="italic">F</text>
  <text x="292" y="32"  font-family="serif" font-size="16" font-style="italic">G</text>
  <text x="159" y="290" font-family="serif" font-size="16" font-style="italic">H</text>
</svg>
