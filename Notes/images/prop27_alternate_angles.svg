<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300">
  <!-- Byrne-style: Prop I.27 — Alternate angles equal → lines parallel -->
  <!-- Line AB at y=100 (upper parallel) -->
  <line x1="30" y1="100" x2="390" y2="100" stroke="#333" stroke-width="2.2"/>
  <!-- Line CD at y=210 (lower parallel) -->
  <line x1="30" y1="210" x2="390" y2="210" stroke="#333" stroke-width="2.2"/>
  <!-- Transversal GH: from (310,40) to (110,270) -->
  <line x1="310" y1="40" x2="110" y2="270" stroke="#555" stroke-width="2"/>
  <!-- Intersection E with AB: parameterize transversal: start(310,40) dir(-200,230) -->
  <!-- At y=100: 40+t*230=100 → t=60/230=0.261; x=310-0.261*200=310-52.2=257.8 ≈ E=(258,100) -->
  <!-- Intersection F with CD: At y=210: 40+t*230=210 → t=170/230=0.739; x=310-0.739*200=310-147.8=162.2 ≈ F=(162,210) -->
  <!-- Alternate interior angles: angle AEF (above E left) and angle EFD (below F right) — mark blue -->
  <!-- Angle arc at E for angle AEF: direction from E toward A and toward F -->
  <!-- E=(258,100): toward A is left, toward F=(162,210) dir=(-96,110) angle=atan(110/-96)?=acos(96/146)=48.9° SE of west = about 229° from east=east+180+acos... -->
  <!-- Let me just draw arcs roughly -->
  <!-- Arc at E for angle on the A side (left-below) -->
  <path d="M 228,100 A 30,30 0 0,0 243,127" fill="#3366cc" fill-opacity="0.35" stroke="#3366cc" stroke-width="1.5"/>
  <!-- Arc at F for alternate angle on D side (right-above) -->
  <path d="M 177,183 A 30,30 0 0,0 192,210" fill="#3366cc" fill-opacity="0.35" stroke="#3366cc" stroke-width="1.5"/>
  <!-- Equal-angle tick marks -->
  <text x="228" y="118" font-family="serif" font-size="13" fill="#3366cc">&#x2032;</text>
  <text x="183" y="200" font-family="serif" font-size="13" fill="#3366cc">&#x2032;</text>
  <!-- Intersection dots -->
  <circle cx="258" cy="100" r="4" fill="#333"/>
  <circle cx="162" cy="210" r="4" fill="#333"/>
  <!-- Endpoint dots of transversal -->
  <circle cx="310" cy="40"  r="3" fill="#555"/>
  <circle cx="110" cy="270" r="3" fill="#555"/>
  <!-- Labels -->
  <text x="14"  y="105" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="393" y="105" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="14"  y="215" font-family="serif" font-size="17" font-style="italic">C</text>
  <text x="393" y="215" font-family="serif" font-size="17" font-style="italic">D</text>
  <text x="315" y="40"  font-family="serif" font-size="17" font-style="italic">G</text>
  <text x="96"  y="275" font-family="serif" font-size="17" font-style="italic">H</text>
  <text x="263" y="95"  font-family="serif" font-size="15" font-style="italic">E</text>
  <text x="150" y="228" font-family="serif" font-size="15" font-style="italic">F</text>
</svg>
