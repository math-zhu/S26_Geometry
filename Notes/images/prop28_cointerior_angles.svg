<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300">
  <!-- Byrne-style: Prop I.28 — Exterior angle = interior opposite → lines parallel -->
  <!-- Line AB at y=130 -->
  <line x1="30" y1="130" x2="390" y2="130" stroke="#333" stroke-width="2.2"/>
  <!-- Line CD at y=230 -->
  <line x1="30" y1="230" x2="390" y2="230" stroke="#333" stroke-width="2.2"/>
  <!-- Transversal: extended from top (G) through E on AB and F on CD to bottom (H) -->
  <!-- Same geometry: transversal from (310,40) to (110,280) -->
  <!-- At y=130: t=(130-40)/240=90/240=0.375; x=310-0.375*200=310-75=235 → E=(235,130) -->
  <!-- At y=230: t=(230-40)/240=190/240=0.792; x=310-0.792*200=310-158.4=151.6 → F=(152,230) -->
  <line x1="310" y1="40" x2="110" y2="280" stroke="#555" stroke-width="2"/>
  <!-- Exterior angle at E on left-above (angle GEB''... angle between G-direction and B-direction) -->
  <!-- G is above-right, B is to the right. Exterior angle = above-right arc from G-dir to B-dir (small angle, upper right) -->
  <path d="M 258,120 A 30,30 0 0,1 265,130" fill="#cc3333" fill-opacity="0.40" stroke="#cc3333" stroke-width="1.5"/>
  <!-- Interior angle at F on right side (angle EFD: between E-direction upward and D-direction right) -->
  <path d="M 175,218 A 30,30 0 0,1 182,230" fill="#cc3333" fill-opacity="0.40" stroke="#cc3333" stroke-width="1.5"/>
  <!-- Co-interior (same-side) angle region — show angle AEF + angle EFC = 180° (supplementary fill) -->
  <!-- Angle AEF at E on left (below, toward A and F) — yellow fill -->
  <path d="M 205,130 A 30,30 0 0,1 220,152" fill="#fffacc" opacity="0.7" stroke="#cc8800" stroke-width="1.3"/>
  <!-- Angle EFC region at F (above, toward E and C) -->
  <path d="M 130,218 A 30,30 0 0,0 152,200" fill="#fffacc" opacity="0.7" stroke="#cc8800" stroke-width="1.3"/>
  <!-- Equal-angle marks (red) for exterior = interior opposite -->
  <text x="258" y="118" font-family="serif" font-size="12" fill="#cc3333">&#x2032;</text>
  <text x="180" y="218" font-family="serif" font-size="12" fill="#cc3333">&#x2032;</text>
  <!-- Intersection dots -->
  <circle cx="235" cy="130" r="4" fill="#333"/>
  <circle cx="152" cy="230" r="4" fill="#333"/>
  <!-- Labels -->
  <text x="14"  y="135" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="393" y="135" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="14"  y="235" font-family="serif" font-size="17" font-style="italic">C</text>
  <text x="393" y="235" font-family="serif" font-size="17" font-style="italic">D</text>
  <text x="314" y="40"  font-family="serif" font-size="17" font-style="italic">G</text>
  <text x="96"  y="285" font-family="serif" font-size="17" font-style="italic">H</text>
  <text x="240" y="125" font-family="serif" font-size="15" font-style="italic">E</text>
  <text x="140" y="248" font-family="serif" font-size="15" font-style="italic">F</text>
</svg>
