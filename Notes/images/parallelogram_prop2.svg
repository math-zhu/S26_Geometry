<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280">

  <!-- Parallelogram ABCD: A=(60,220), B=(320,220), C=(360,60), D=(100,60) -->

  <!-- Parallelogram sides -->
  <line x1="60"  y1="220" x2="320" y2="220" stroke="black" stroke-width="2"/>
  <line x1="100" y1="60"  x2="360" y2="60"  stroke="black" stroke-width="2"/>
  <line x1="60"  y1="220" x2="100" y2="60"  stroke="black" stroke-width="2"/>
  <line x1="320" y1="220" x2="360" y2="60"  stroke="black" stroke-width="2"/>

  <!-- Diagonal BD -->
  <line x1="320" y1="220" x2="100" y2="60" stroke="black" stroke-width="2" stroke-dasharray="7,4"/>
  <!-- Tick mark on BD at midpoint (210,140), perpendicular to BD -->
  <line x1="214" y1="135" x2="207" y2="145" stroke="black" stroke-width="1.8"/>

  <!-- Double tick marks on AB (given AB = CD) -->
  <!-- AB midpoint (190,220) -->
  <line x1="185" y1="213" x2="185" y2="227" stroke="black" stroke-width="1.8"/>
  <line x1="192" y1="213" x2="192" y2="227" stroke="black" stroke-width="1.8"/>
  <!-- CD midpoint (230,60) -->
  <line x1="225" y1="53" x2="225" y2="67" stroke="black" stroke-width="1.8"/>
  <line x1="232" y1="53" x2="232" y2="67" stroke="black" stroke-width="1.8"/>

  <!-- Blue arcs: ∠ABD at B and ∠CDB at D (alternate interior angles from AB ∥ CD) -->
  <!-- ∠ABD at B: between ray BA (left) and ray BD (upper-left), r=25 -->
  <path d="M 295,220 A 25,25 0 0,1 300,205" fill="none" stroke="blue" stroke-width="1.8"/>
  <!-- ∠CDB at D: between ray DC (right) and ray DB (lower-right), r=25 -->
  <path d="M 125,60  A 25,25 0 0,1 120,75"  fill="none" stroke="blue" stroke-width="1.8"/>

  <!-- Vertex labels -->
  <text x="44"  y="238" font-family="serif" font-style="italic" font-size="18">A</text>
  <text x="326" y="238" font-family="serif" font-style="italic" font-size="18">B</text>
  <text x="366" y="56"  font-family="serif" font-style="italic" font-size="18">C</text>
  <text x="82"  y="52"  font-family="serif" font-style="italic" font-size="18">D</text>

</svg>
