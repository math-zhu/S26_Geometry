<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360">
  <!-- Triangle A=(80,270), B=(340,270), C=(170,90)
       Circumcenter O=(210,222), R≈139
       ℓ1: perp bisector of AB — vertical x=210, mid=(210,270)
       ℓ2: perp bisector of BC — slope=-17/18, through mid=(255,180)
            at x=80:  y=180+(-17/18)*(80-255) =180+165.3=345.3
            at x=380: y=180+(-17/18)*(380-255)=180-117.8=62.2
  -->

  <!-- Circumscribed circle -->
  <circle cx="210" cy="222" r="139" fill="#eef4ff" stroke="#3366cc" stroke-width="1.8"/>

  <!-- Triangle sides -->
  <line x1="80"  y1="270" x2="340" y2="270" stroke="#3366cc" stroke-width="2"/>
  <line x1="80"  y1="270" x2="170" y2="90"  stroke="#3366cc" stroke-width="2"/>
  <line x1="340" y1="270" x2="170" y2="90"  stroke="#3366cc" stroke-width="2"/>

  <!-- ℓ1: perp bisector of AB (vertical, red) -->
  <line x1="210" y1="15" x2="210" y2="345" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="7,4"/>
  <!-- right-angle mark at midAB=(210,270) -->
  <rect x="210" y="261" width="9" height="9" fill="none" stroke="#cc3333" stroke-width="1.3"/>
  <circle cx="210" cy="270" r="2.2" fill="#cc3333"/>
  <text x="214" y="258" font-family="serif" font-size="13" font-style="italic" fill="#cc3333">&#x2113;&#x2081;</text>

  <!-- ℓ2: perp bisector of BC (slope -17/18, green) -->
  <line x1="85" y1="342" x2="378" y2="64" stroke="#228833" stroke-width="1.5" stroke-dasharray="7,4"/>
  <circle cx="255" cy="180" r="2.2" fill="#228833"/>
  <text x="260" y="175" font-family="serif" font-size="13" font-style="italic" fill="#228833">&#x2113;&#x2082;</text>

  <!-- Vertices -->
  <circle cx="80"  cy="270" r="3.5" fill="#3366cc"/>
  <circle cx="340" cy="270" r="3.5" fill="#3366cc"/>
  <circle cx="170" cy="90"  r="3.5" fill="#3366cc"/>
  <text x="62"  y="288" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="344" y="288" font-family="serif" font-size="17" font-style="italic">B</text>
  <text x="163" y="80"  font-family="serif" font-size="17" font-style="italic">C</text>

  <!-- Circumcenter O -->
  <circle cx="210" cy="222" r="4" fill="#cc3333"/>
  <text x="216" y="219" font-family="serif" font-size="16" font-style="italic" fill="#cc3333">O</text>

  <!-- Radii OA, OB dashed -->
  <line x1="210" y1="222" x2="80"  y2="270" stroke="#cc3333" stroke-width="1.1" stroke-dasharray="4,3"/>
  <line x1="210" y1="222" x2="340" y2="270" stroke="#cc3333" stroke-width="1.1" stroke-dasharray="4,3"/>
  <line x1="210" y1="222" x2="170" y2="90"  stroke="#cc3333" stroke-width="1.1" stroke-dasharray="4,3"/>

  <!-- Caption -->
  <text x="210" y="355" text-anchor="middle" font-family="serif" font-size="14">
    &#x2113;&#x2081; &#x2229; &#x2113;&#x2082; = {O};&#160; OA = OB = OC
  </text>
</svg>
