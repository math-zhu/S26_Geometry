<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 270">
  <defs>
    <marker id="arrowAxis" markerWidth="9" markerHeight="7" refX="9" refY="3.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" fill="black"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="10" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 4, 0 8" fill="#3366cc"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="10" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 4, 0 8" fill="#cc3333"/>
    </marker>
  </defs>

  <!-- origin: (180, 155), scale: 70px/unit -->
  <!-- x: -2→40, -1→110, 0→180, 1→250, 2→320  |  y: -1→225, 0→155, 1→85, 2→15 -->

  <!-- X axis -->
  <line x1="20" y1="155" x2="360" y2="155" stroke="black" stroke-width="1.5"
        marker-end="url(#arrowAxis)"/>
  <text x="365" y="160" font-family="serif" font-size="16" font-style="italic">x</text>

  <!-- Y axis -->
  <line x1="180" y1="260" x2="180" y2="10" stroke="black" stroke-width="1.5"
        marker-end="url(#arrowAxis)"/>
  <text x="173" y="7" font-family="serif" font-size="16" font-style="italic">y</text>

  <!-- Origin -->
  <text x="162" y="172" font-family="serif" font-size="14">O</text>

  <!-- Tick marks x -->
  <line x1="110" y1="150" x2="110" y2="160" stroke="black" stroke-width="1.2"/>
  <text x="110" y="173" text-anchor="middle" font-family="serif" font-size="13">−1</text>
  <line x1="250" y1="150" x2="250" y2="160" stroke="black" stroke-width="1.2"/>
  <text x="250" y="173" text-anchor="middle" font-family="serif" font-size="13">1</text>
  <line x1="320" y1="150" x2="320" y2="160" stroke="black" stroke-width="1.2"/>
  <text x="320" y="173" text-anchor="middle" font-family="serif" font-size="13">2</text>

  <!-- Tick marks y -->
  <line x1="175" y1="225" x2="185" y2="225" stroke="black" stroke-width="1.2"/>
  <text x="167" y="230" text-anchor="end" font-family="serif" font-size="13">−1</text>
  <line x1="175" y1="85"  x2="185" y2="85"  stroke="black" stroke-width="1.2"/>
  <text x="167" y="90"  text-anchor="end" font-family="serif" font-size="13">1</text>

  <!-- Blue vector (1,1): from origin (180,155) to (250,85) -->
  <circle cx="180" cy="155" r="4.5" fill="#3366cc"/>
  <line x1="180" y1="155" x2="250" y2="85" stroke="#3366cc" stroke-width="2.5"
        marker-end="url(#arrowBlue)"/>
  <text x="230" y="105" font-family="serif" font-size="14" fill="#3366cc">(1, 1)</text>

  <!-- Red vector (-1,-1): from origin (180,155) to (110,225) -->
  <circle cx="180" cy="155" r="4.5" fill="#cc3333"/>
  <line x1="180" y1="155" x2="110" y2="225" stroke="#cc3333" stroke-width="2.5"
        marker-end="url(#arrowRed)"/>
  <text x="110" y="248" font-family="serif" font-size="14" fill="#cc3333">(−1, −1)</text>
</svg>
