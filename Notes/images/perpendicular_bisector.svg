<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260">
  <!-- Segment AB: A=(60,130), B=(320,130) -->
  <line x1="60" y1="130" x2="320" y2="130" stroke="#3366cc" stroke-width="2"/>
  <circle cx="60"  cy="130" r="3" fill="#3366cc"/>
  <circle cx="320" cy="130" r="3" fill="#3366cc"/>
  <text x="44"  y="148" font-family="serif" font-size="17" font-style="italic">A</text>
  <text x="324" y="148" font-family="serif" font-size="17" font-style="italic">B</text>

  <!-- Midpoint M=(190,130) -->
  <circle cx="190" cy="130" r="3" fill="#cc3333"/>
  <text x="188" y="150" font-family="serif" font-size="15" font-style="italic" fill="#cc3333">M</text>

  <!-- Perpendicular bisector through M=(190,130), vertical -->
  <line x1="190" y1="30" x2="190" y2="230" stroke="#cc3333" stroke-width="2" stroke-dasharray="7,4"/>

  <!-- Right angle mark at M -->
  <rect x="190" y="122" width="10" height="8" fill="none" stroke="#cc3333" stroke-width="1.5"/>

  <!-- Two example points P and Q on perp bisector with equal distances to A and B -->
  <!-- P=(190,60): PA=PB=sqrt(130^2+70^2)=sqrt(16900+4900)=sqrt(21800)≈147.6 -->
  <circle cx="190" cy="65"  r="3" fill="#228833"/>
  <circle cx="190" cy="195" r="3" fill="#228833"/>
  <text x="197" y="63"  font-family="serif" font-size="15" font-style="italic" fill="#228833">P</text>
  <text x="197" y="198" font-family="serif" font-size="15" font-style="italic" fill="#228833">Q</text>

  <!-- PA and PB dashed lines -->
  <line x1="60"  y1="130" x2="190" y2="65"  stroke="#228833" stroke-width="1.3" stroke-dasharray="5,3"/>
  <line x1="320" y1="130" x2="190" y2="65"  stroke="#228833" stroke-width="1.3" stroke-dasharray="5,3"/>
  <!-- QA and QB dashed lines -->
  <line x1="60"  y1="130" x2="190" y2="195" stroke="#228833" stroke-width="1.3" stroke-dasharray="5,3"/>
  <line x1="320" y1="130" x2="190" y2="195" stroke="#228833" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- tick marks on PA=PB -->
  <line x1="118" y1="92"  x2="124" y2="100" stroke="#228833" stroke-width="1.8"/>
  <line x1="258" y1="92"  x2="252" y2="100" stroke="#228833" stroke-width="1.8"/>
  <!-- tick marks on QA=QB -->
  <line x1="118" y1="168" x2="124" y2="160" stroke="#228833" stroke-width="1.8"/>
  <line x1="258" y1="168" x2="252" y2="160" stroke="#228833" stroke-width="1.8"/>

  <!-- Caption -->
  <text x="190" y="252" text-anchor="middle" font-family="serif" font-size="14">
    Perpendicular bisector of AB: PA = PB for all P on the line
  </text>
</svg>
