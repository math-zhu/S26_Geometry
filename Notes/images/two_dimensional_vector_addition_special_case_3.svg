<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270">
  <defs>
    <marker id="arrowAxis" markerWidth="9" markerHeight="7" refX="9" refY="3.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" fill="black"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="10" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 4, 0 8" fill="#3366cc"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="10" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 4, 0 8" fill="#cc3333"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="8" refX="10" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 4, 0 8" fill="#884499"/>
    </marker>
  </defs>

  <!-- origin: (80, 195), scale: 80px/unit -->
  <!-- (0,0)→(80,195)  (2,0)→(240,195)  (0,1)→(80,115)  (2,1)→(240,115) -->

  <!-- X axis -->
  <line x1="30" y1="195" x2="340" y2="195" stroke="black" stroke-width="1.5"
        marker-end="url(#arrowAxis)"/>
  <text x="345" y="200" font-family="serif" font-size="16" font-style="italic">x</text>

  <!-- Y axis -->
  <line x1="80" y1="250" x2="80" y2="12" stroke="black" stroke-width="1.5"
        marker-end="url(#arrowAxis)"/>
  <text x="73" y="9" font-family="serif" font-size="16" font-style="italic">y</text>

  <!-- Origin -->
  <text x="62" y="212" font-family="serif" font-size="14">O</text>

  <!-- Tick marks x -->
  <line x1="160" y1="190" x2="160" y2="200" stroke="black" stroke-width="1.2"/>
  <text x="160" y="213" text-anchor="middle" font-family="serif" font-size="13">1</text>
  <line x1="240" y1="190" x2="240" y2="200" stroke="black" stroke-width="1.2"/>
  <text x="240" y="213" text-anchor="middle" font-family="serif" font-size="13">2</text>
  <line x1="320" y1="190" x2="320" y2="200" stroke="black" stroke-width="1.2"/>
  <text x="320" y="213" text-anchor="middle" font-family="serif" font-size="13">3</text>

  <!-- Tick marks y -->
  <line x1="75" y1="115" x2="85" y2="115" stroke="black" stroke-width="1.2"/>
  <text x="67" y="120" text-anchor="end" font-family="serif" font-size="13">1</text>
  <line x1="75" y1="35"  x2="85" y2="35"  stroke="black" stroke-width="1.2"/>
  <text x="67" y="40"  text-anchor="end" font-family="serif" font-size="13">2</text>

  <!-- Parallelogram dashed sides -->
  <line x1="80"  y1="115" x2="240" y2="115" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="240" y1="195" x2="240" y2="115" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- Blue vector (2,0): from (0,0) to (2,0) -->
  <circle cx="80" cy="195" r="4.5" fill="#3366cc"/>
  <line x1="80" y1="195" x2="240" y2="195" stroke="#3366cc" stroke-width="2.5"
        marker-end="url(#arrowBlue)"/>
  <text x="160" y="215" text-anchor="middle" font-family="serif" font-size="14"
        fill="#3366cc">(2, 0)</text>

  <!-- Red vector (0,1): from (0,0) to (0,1) -->
  <line x1="80" y1="195" x2="80" y2="115" stroke="#cc3333" stroke-width="2.5"
        marker-end="url(#arrowRed)"/>
  <text x="103" y="155" font-family="serif" font-size="14" fill="#cc3333">(0, 1)</text>

  <!-- Result (diagonal) vector (2,1): from (0,0) to (2,1) -->
  <circle cx="240" cy="115" r="4.5" fill="#884499"/>
  <line x1="80" y1="195" x2="240" y2="115" stroke="#884499" stroke-width="2.5"
        marker-end="url(#arrowPurple)"/>
  <text x="140" y="143" font-family="serif" font-size="14" fill="#884499">(2, 1)</text>
</svg>
